  <!-- ✅ index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Main Chat UI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="navbar">
  <div class="nav-left">
    <a href="home.html" class="home-button">HOME</a>
    <a href="index.html" class="home-button">STARTING</a>
  </div>
  <ul class="nav-links">
    <li><a href="story.html">💡MOTIVATION </a></li>
    <li><a href="intro.html#profile">About Us</a></li>
    <li><a href="intro.html#contact">Contact</a></li>
    <li><a href="https://www.coderarmy.in/">Coder Army</a></li>
  </ul>
</div>



  <!-- ✅ REST OF YOUR CHAT UI -->
  <div id="container">
    <div id="sidebar">
      <button id="new-chat-btn">+ New Chat</button>
      <input type="text" id="search-input" placeholder="Search chats..." autocomplete="off" />
      <div id="history-list" title="Chat History"></div>
    </div>

    <div id="main">
      <div id="profile-bar">
        <div id="profile-info">
          <img src="./rohitnegipick.jpeg" id="profile-pic" alt="Rohit Bhaiya" />
          <div>
            <div style="font-weight:bold; font-size:18px;">Rohit Bhaiya 💻</div>
            <div style="font-size:13px; opacity:0.7;">Online</div>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <button id="theme-toggle" title="Toggle theme">&#9728;</button>
          <div id="google-signin-btn"></div>
        </div>
      </div>

      <div id="chat-window"></div>
      <div id="input-area">
        <input id="input" type="text" placeholder="Ask Rohit Bhaiya..." autocomplete="off" />
        <button id="send-btn">Send</button>
      </div>
    </div>
  </div>
<script>
  function showToast(message) {
    const toast = document.createElement("div");
    toast.className = "toast";
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => {
      toast.remove();
    }, 2000);
  }

  function handleCredentialResponse(response) {
    console.log("Encoded JWT ID token: " + response.credential);
    alert("Google Sign-In Successful!");
  }

  const body = document.body;
  const themeToggle = document.getElementById("theme-toggle");

  window.onload = function () {
    google.accounts.id.initialize({
      client_id: "YOUR_CLIENT_ID_HERE.apps.googleusercontent.com",
      callback: handleCredentialResponse
    });

    renderSignInBtn();

    themeToggle.onclick = () => {
      body.classList.toggle("light");
      themeToggle.innerHTML = body.classList.contains("light") ? "\u263E" : "\u2600";
      renderSignInBtn();
    };
  };

  function renderSignInBtn() {
    google.accounts.id.renderButton(
      document.getElementById("google-signin-btn"),
      {
        theme: body.classList.contains("light") ? "outline" : "filled_black",
        size: "large",
        type: "standard",
        text: "signin_with"
      }
    );
  }

  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send-btn");
  const chatWindow = document.getElementById("chat-window");
  const newChatBtn = document.getElementById("new-chat-btn");
  const historyList = document.getElementById("history-list");
  const searchInput = document.getElementById("search-input");

  let chatHistory = [];
  let currentChat = [];
  let chatSessionId = Date.now();

  function formatTime(date) {
    let h = date.getHours();
    let m = date.getMinutes();
    const ampm = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    m = m < 10 ? "0" + m : m;
    return `${h}:${m} ${ampm}`;
  }

  function renderMessages() {
    chatWindow.innerHTML = "";
    currentChat.forEach((msg, index) => {
      const div = document.createElement("div");
      div.className = `message ${msg.sender}`;

      const copyBtn = document.createElement("button");
      copyBtn.className = "copy-btn";
      copyBtn.innerHTML = "📋";
      copyBtn.title = "Copy";
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(msg.text).then(() => {
          showToast("Message copied!");
        });
      };
      div.appendChild(copyBtn);

      const lowerText = msg.text.toLowerCase();
      if (
        msg.sender === "bot" &&
        (lowerText.includes("hahaha") || lowerText.includes("lol") || lowerText.includes("majak") || lowerText.includes("funny"))
      ) {
        const reactionImg = document.createElement("img");
        reactionImg.src = "https://i.imgur.com/d3MvvkX.gif";
        reactionImg.className = "reaction-img";
        div.appendChild(reactionImg);
      }

      if (msg.sender === "bot" && index === currentChat.length - 1) {
        const span = document.createElement("span");
        div.appendChild(span);
        chatWindow.appendChild(div);
        typeWriter(span, msg.text, 0);
      } else {
        const span = document.createElement("span");
        span.textContent = msg.text;
        div.appendChild(span);
        chatWindow.appendChild(div);
      }
    });
    chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: "smooth" });
  }

  function typeWriter(element, text, i) {
    if (i < text.length) {
      element.textContent += text.charAt(i);
      chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: "smooth" });
      setTimeout(() => typeWriter(element, text, i + 1), 20);
    }
  }

  function addMessage(text, sender) {
    currentChat.push({ text, sender, time: new Date() });
    renderMessages();
  }

  function renderHistory(filter = "") {
    historyList.innerHTML = "";
    chatHistory.forEach((chat, index) => {
      const firstUserMsg = chat.find(m => m.sender === 'user');
      if (firstUserMsg && firstUserMsg.text.toLowerCase().includes(filter.toLowerCase())) {
        const div = document.createElement("div");
        div.textContent = firstUserMsg.text.slice(0, 40);
        div.title = firstUserMsg.text;
        div.onclick = () => {
          currentChat = [...chat];
          renderMessages();
        };
        const timeSpan = document.createElement("span");
        timeSpan.className = "time";
        timeSpan.textContent = formatTime(firstUserMsg.time || new Date());
        div.appendChild(timeSpan);
        historyList.appendChild(div);
      }
    });
  }

  newChatBtn.onclick = () => {
    if (currentChat.length) chatHistory.push([...currentChat]);
    currentChat = [];
    renderMessages();
    renderHistory();
    chatSessionId = Date.now();
  };

  searchInput.oninput = () => {
    renderHistory(searchInput.value);
  };

  fetch("https://rohitnegi-chatbot.onrender.com").catch((e) => {
    console.log("Warming up the server...");
  });

  sendBtn.onclick = async () => {
    const userMsg = input.value.trim();
    if (!userMsg) return;

    const sessionAtStart = chatSessionId;

    addMessage(userMsg, "user");
    input.value = "";

    const typingMsg = { text: "Typing...", sender: "bot", time: new Date() };
    currentChat.push(typingMsg);
    renderMessages();

    try {
      const apiURL = location.hostname === "localhost"
        ? "http://localhost:3000/chat"
        : "https://rohitnegi-chatbot.onrender.com/chat";

      const res = await fetch(apiURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: userMsg })
      });

      if (!res.ok) throw new Error("Server error");

      const data = await res.json();

      if (sessionAtStart !== chatSessionId) return;

      currentChat.pop();
      addMessage(data.reply, "bot");

    } catch (error) {
      currentChat.pop();
      addMessage("Server se response nahi mila, try again later.", "bot");
      console.error(error);
    }
  };

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendBtn.click();
  });

  renderHistory();
</script>


</body>
</html>
